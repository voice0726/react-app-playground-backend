name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://playground:playground@localhost:5432/playground?sslmode=disable
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
          POSTGRES_DB: playground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playground -d playground"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/migrate up
      - run: go run ./cmd/migrate down 1
      - run: go run ./cmd/migrate up
      - run: go test -tags=integration ./test/integration
      - run: go build ./cmd/api
      - run: docker build .
