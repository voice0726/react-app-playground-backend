name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://playground:playground@localhost:5432/playground?sslmode=disable
      PLAYGROUND_INTEGRATION_ALLOW_RESET: "1"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: playground
          POSTGRES_PASSWORD: playground
          POSTGRES_DB: playground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playground -d playground"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: '1.27.0' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/migrate up
      - run: go run ./cmd/migrate down 1
      - run: go run ./cmd/migrate up
      - run: go test -tags=integration ./test/integration
      - run: go build ./cmd/api
      - run: docker build .
