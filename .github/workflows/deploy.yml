name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: react-app-playground-backend
  REGION: us-central1

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/react-app-playground-backend/react-app-playground-backend/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/216002183558/locations/global/workloadIdentityPools/github/providers/github
          service_account: playground-deploy@react-app-playground-backend.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and publish image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Update migrate Job
        run: >-
          gcloud run jobs update react-app-playground-backend-migrate
          --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE"

      - name: Run database migrations
        run: >-
          gcloud run jobs execute react-app-playground-backend-migrate
          --project "$PROJECT_ID" --region "$REGION" --wait

      - name: Deploy Cloud Run service
        run: >-
          gcloud run deploy react-app-playground-backend
          --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" --quiet
